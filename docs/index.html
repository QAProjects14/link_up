<!DOCTYPE html>
<html>
<head>
  <base href="/link_up/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LinkUp — Official Notification App of Lyceum Northwestern University">

  <!-- iOS PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinkUp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>LinkUp — LNU</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── PWA Install Banner ───────────────────────────────────────────── */
    #pwa-banner {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 99999;
      padding: 0 16px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #pwa-banner.visible { display: block; }

    .pwa-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 -2px 32px rgba(0,0,0,0.18), 0 4px 24px rgba(0,0,0,0.12);
      padding: 20px 20px 22px;
      position: relative;
    }

    .pwa-dismiss {
      position: absolute;
      top: 14px; right: 16px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 28px; height: 28px;
      font-size: 15px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #666;
    }

    .pwa-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .pwa-icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      background: #A63C45;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .pwa-icon img { width: 36px; height: 36px; object-fit: contain; }

    .pwa-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    .pwa-subtitle {
      font-size: 12px;
      color: #888;
    }

    /* Android install button */
    .pwa-install-btn {
      width: 100%;
      padding: 14px;
      background: #A63C45;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .pwa-install-btn:active { background: #8a3039; }

    /* iOS instructions */
    .pwa-ios-steps {
      font-size: 13px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 0;
    }
    .pwa-ios-steps strong { color: #1a1a1a; }

    .pwa-share-icon {
      display: inline-block;
      width: 20px; height: 20px;
      vertical-align: middle;
      margin: 0 2px;
    }

    /* iOS arrow pointing to share button */
    .pwa-ios-arrow {
      text-align: center;
      margin-top: 10px;
      font-size: 22px;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* slide-up animation */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    #pwa-banner.visible .pwa-card {
      animation: slideUp 0.35s cubic-bezier(0.34,1.1,0.64,1) both;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- ── PWA Install Banner ───────────────────────────────────────────── -->
  <div id="pwa-banner">
    <div class="pwa-card">
      <button class="pwa-dismiss" id="pwa-dismiss" aria-label="Dismiss">✕</button>

      <div class="pwa-row">
        <div class="pwa-icon">
          <img src="icons/Icon-192.png" alt="LinkUp" />
        </div>
        <div>
          <div class="pwa-title">Install LinkUp</div>
          <div class="pwa-subtitle">Lyceum Northwestern University</div>
        </div>
      </div>

      <!-- Android: native install button (shown by JS) -->
      <button class="pwa-install-btn" id="pwa-install-btn" style="display:none">
        ⬇&nbsp; Install App
      </button>

      <!-- iOS: manual instructions (shown by JS) -->
      <div class="pwa-ios-steps" id="pwa-ios-steps" style="display:none">
        Tap the
        <svg class="pwa-share-icon" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        <strong>Share</strong> button at the bottom of Safari,
        then tap <strong>"Add to Home Screen"</strong> to install LinkUp.
        <div class="pwa-ios-arrow">↓</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'linkup-pwa-dismissed';
      var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;

      // Already installed or user dismissed → don't show
      if (isStandalone || sessionStorage.getItem(STORAGE_KEY)) return;

      var banner      = document.getElementById('pwa-banner');
      var dismissBtn  = document.getElementById('pwa-dismiss');
      var installBtn  = document.getElementById('pwa-install-btn');
      var iosSteps    = document.getElementById('pwa-ios-steps');
      var deferredEvt = null;

      function showBanner() {
        banner.classList.add('visible');
      }

      function hideBanner() {
        banner.classList.remove('visible');
        sessionStorage.setItem(STORAGE_KEY, '1');
      }

      dismissBtn.addEventListener('click', hideBanner);

      if (isIos) {
        // iOS: show instructions after app loads
        iosSteps.style.display = 'block';
        setTimeout(showBanner, 3500);
      } else {
        // Android/Chrome: capture beforeinstallprompt for native dialog
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredEvt = e;
          installBtn.style.display = 'block';
          setTimeout(showBanner, 3500);
        });

        installBtn.addEventListener('click', function () {
          if (!deferredEvt) return;
          deferredEvt.prompt();
          deferredEvt.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') hideBanner();
            deferredEvt = null;
          });
        });

        // If already meets PWA criteria on first load (rare), show after delay
        window.addEventListener('appinstalled', hideBanner);
      }
    })();
  </script>
</body>
</html>
