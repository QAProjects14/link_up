<!DOCTYPE html>
<html>
<head>
  <base href="/link_up/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LinkUp — Official Notification App of Lyceum Northwestern University">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinkUp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>LinkUp — LNU</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #pwa-banner{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:0 16px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    #pwa-banner.visible{display:block}
    .pwa-card{background:#fff;border-radius:20px;box-shadow:0 -2px 32px rgba(0,0,0,.18),0 4px 24px rgba(0,0,0,.12);padding:20px 20px 22px;position:relative}
    .pwa-dismiss{position:absolute;top:14px;right:16px;background:#f0f0f0;border:none;border-radius:50%;width:28px;height:28px;font-size:15px;cursor:pointer;color:#666}
    .pwa-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
    .pwa-icon{width:52px;height:52px;border-radius:12px;background:#A63C45;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .pwa-icon img{width:36px;height:36px;object-fit:contain}
    .pwa-title{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:2px}
    .pwa-subtitle{font-size:12px;color:#888}
    .pwa-install-btn{width:100%;padding:14px;background:#A63C45;color:#fff;font-size:15px;font-weight:700;border:none;border-radius:14px;cursor:pointer}
    .pwa-install-btn:active{background:#8a3039}
    .pwa-ios-steps{font-size:13px;color:#444;line-height:1.6}
    .pwa-ios-steps strong{color:#1a1a1a}
    .pwa-share-icon{display:inline-block;width:18px;height:18px;vertical-align:middle;margin:0 2px}
    .pwa-ios-arrow{text-align:center;margin-top:8px;font-size:20px;animation:bounce 1.2s infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    #pwa-banner.visible .pwa-card{animation:slideUp .35s cubic-bezier(.34,1.1,.64,1) both}
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <div id="pwa-banner">
    <div class="pwa-card">
      <button class="pwa-dismiss" id="pwa-dismiss">✕</button>
      <div class="pwa-row">
        <div class="pwa-icon"><img src="icons/Icon-192.png" alt="LinkUp"/></div>
        <div>
          <div class="pwa-title">Install LinkUp</div>
          <div class="pwa-subtitle">Lyceum Northwestern University</div>
        </div>
      </div>
      <button class="pwa-install-btn" id="pwa-install-btn" style="display:none">⬇&nbsp; Install App</button>
      <div class="pwa-ios-steps" id="pwa-ios-steps" style="display:none">
        Tap the
        <svg class="pwa-share-icon" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        <strong>Share</strong> button, then <strong>"Add to Home Screen"</strong> to receive notifications even when Safari is closed.
        <div class="pwa-ios-arrow">↓</div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var KEY='linkup-pwa-dismissed';
      var isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
      var isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
      if(isStandalone||sessionStorage.getItem(KEY))return;
      var banner=document.getElementById('pwa-banner');
      var dismiss=document.getElementById('pwa-dismiss');
      var installBtn=document.getElementById('pwa-install-btn');
      var iosSteps=document.getElementById('pwa-ios-steps');
      var deferred=null;
      function show(){banner.classList.add('visible')}
      function hide(){banner.classList.remove('visible');sessionStorage.setItem(KEY,'1')}
      dismiss.addEventListener('click',hide);
      if(isIos){
        iosSteps.style.display='block';
        setTimeout(show,3500);
      } else {
        window.addEventListener('beforeinstallprompt',function(e){
          e.preventDefault();deferred=e;
          installBtn.style.display='block';
          setTimeout(show,3500);
        });
        installBtn.addEventListener('click',function(){
          if(!deferred)return;
          deferred.prompt();
          deferred.userChoice.then(function(c){if(c.outcome==='accepted')hide();deferred=null});
        });
        window.addEventListener('appinstalled',hide);
      }
    })();
  </script>
</body>
</html>
